[sdl]
fullscreen = off
fullscreen_mode = forced-borderless
window_size = 800x600
window_position = auto
pause_when_inactive = off
mute_when_inactive = off
output = opengl

[render]
aspect = auto
viewport = fit
integer_scaling = off
shader = sharp

[sblaster]
sbtype = sb16
sbbase = 220
irq = 5
dma = 1
hdma = 5
oplmode = auto

# Diagnostic only: no game directory mounted, no game executable launched.
[dosbox]
startup_verbosity = high

[ipx]
ipx = true

[autoexec]
@echo off
echo MOO2-SGC - Dopefish connection diagnostic
echo Target: moo2.thedopefish.com UDP 213
echo This test does not start MOO2.
echo.
IPXNET CONNECT moo2.thedopefish.com 213
IPXNET STATUS
echo.
echo Read the CONNECT and STATUS messages above.
echo The messages, not this prompt, determine whether the tunnel connected.
echo Capture this screen if the result is unclear.
echo Close this diagnostic before launching your real network game.
echo To close, type EXIT and press Enter.
