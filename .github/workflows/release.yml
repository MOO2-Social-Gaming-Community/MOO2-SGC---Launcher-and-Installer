name: Publish prepared release
on:
  push:
    paths:
      - 'VERSION'
      - 'release/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moo2-sgc-release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.repository == 'MOO2-Social-Gaming-Community/MOO2-SGC---Launcher-and-Installer' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Test the source before publishing
        working-directory: manager
        run: go test -race -count=1 ./... && go vet ./...
      - name: Test the publishing safeguards
        run: python3 -m unittest discover -s tests -p 'test_publish*.py' -v
      - name: Verify signatures and source-to-artifact correspondence
        run: python3 packaging/publish_prebuilt.py
      - name: Publish signed components and verify downloaded copies
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 packaging/publish_prebuilt.py --execute --commit "$RELEASE_COMMIT"
